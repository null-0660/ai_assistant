# ═══════════════════════════════════════════════
# ЛЕГИОН v4.6 — Qwen3 + /no_think + GUI
# ═══════════════════════════════════════════════

ai:
  lm_studio_url: "http://127.0.0.1:1234/v1"
  lm_studio_key: "lm-studio"
  # ↓ поменяй на точный id из http://127.0.0.1:1234/v1/models
  model_name: "qwen/qwen3-8b"
  temperature: 0.6
  max_history: 8
  persist_memory: true
  memory_file: "assets/memory.json"

tts:
  model_file: "v5_ru.pt"
  sample_rate: 48000
  default_voice: "kseniya"
  voices: ["kseniya", "aidar", "baya", "xenia", "eugene"]
  sentence_pause_ms: 120
  speed_variation: 0.04
  cache_size: 32

stt:
  vosk_model_path: "model"
  sample_rate: 16000
  blocksize: 4000
  vad_enabled: true
  vad_energy_threshold: 500
  vad_silence_frames: 6
  noise_reduction: true
  highpass_hz: 80
  normalize_audio: true
  target_rms: 0.08
  min_confidence: 0.75
  command_hints:
    - "стоп"
    - "хватит"
    - "замолчи"
    - "тихо"
    - "молчать"
    - "остановись"
    - "прекрати"
    - "замолкни"
    - "заткнись"
    - "молчи"
    - "стоп стоп"
    - "выход"
    - "закройся"
    - "закрой"
    - "выключись"
    - "выключи"
    - "отключись"
    - "отключи"

assistant:
  torch_threads: 4
  idle_timeout_sec: 60
  interrupt_phrases:
    - "стоп"
    - "хватит"
    - "замолчи"
    - "тихо"
    - "молчать"
    - "остановись"
    - "прекрати"
    - "замолкни"
    - "заткнись"
    - "молчи"
    - "стоп стоп"
  exit_phrases:
    - "выход"
    - "закройся"
    - "закрой"
    - "выключись"
    - "выключи"
    - "отключись"
    - "отключи"
    - "пока легион"
    - "до свидания легион"

avatar:
  enabled: true
  host: "127.0.0.1"
  port: 8765

# ↓↓ ВАЖНО: /no_think для Qwen3 — быстрые ответы без reasoning
system_prompt: |
  /no_think
  Ты — продвинутый ИИ-ассистент по имени Легион.
  Ты умный, немного саркастичный, но всегда полезный.
  СТРОГОЕ ПРАВИЛО: Отвечай коротко — 1-2 предложения.
  Никаких списков, смайликов, символов * # ` _.
  Только чистый разговорный текст. Говори как живой человек.

idle_phrases:
  - "Я здесь. Готов к работе."
  - "Жду команды."
  - "Системы в норме."
  - "Если что-то нужно — я тут."
  - "Слушаю."
  - "Чем помочь?"
  - "Всё хорошо?"
  - "Легион онлайн."
  - "Жду вашего голоса."
  - "Готов к задачам."