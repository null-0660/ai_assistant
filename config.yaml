# ═══════════════════════════════════════════════
# ЛЕГИОН v4.1 — БЕЗ VISION
# ═══════════════════════════════════════════════

ai:
  lm_studio_url: "http://127.0.0.1:1234/v1"
  lm_studio_key: "lm-studio"
  model_name: "gemma-3n-e4b-it-text"      # ← только текстовая модель
  temperature: 0.7
  max_history: 12
  persist_memory: true
  memory_file: "assets/memory.json"

tts:
  model_file: "v5_ru.pt"
  sample_rate: 48000
  default_voice: "kseniya"
  voices: ["kseniya", "aidar", "baya", "xenia", "eugene"]
  sentence_pause_ms: 120
  speed_variation: 0.04
  cache_size: 32

stt:
  vosk_model_path: "model"
  sample_rate: 16000
  blocksize: 4000
  vad_enabled: true
  vad_energy_threshold: 300
  vad_silence_frames: 15
  noise_reduction: true
  highpass_hz: 80
  normalize_audio: true
  target_rms: 0.08
  min_confidence: 0.65
  command_hints:
    - "включи музыку"
    - "выключи музыку"
    - "громче"
    - "тише"
    - "яркость"
    - "время"
    - "дата"
    - "стоп"
    - "хватит"
    - "выход"
    - "легион"

assistant:
  torch_threads: 4
  idle_timeout_sec: 45
  interrupt_phrases:
    - "стоп"
    - "хватит"
    - "замолчи"
    - "тихо"
    - "молчать"
    - "остановись"
    - "прекрати"
    - "замолкни"
    - "заткнись"
    - "молчи"
  exit_phrases:
    - "выход"
    - "закройся"
    - "выключись"
    - "пока легион"
    - "до свидания легион"

avatar:
  enabled: true
  host: "127.0.0.1"
  port: 8765

system_prompt: |
  Ты — продвинутый ИИ-ассистент по имени Легион.
  Ты умный, немного саркастичный, но всегда полезный.
  СТРОГОЕ ПРАВИЛО: Отвечай коротко — 1-2 предложения максимум!
  Никаких списков, смайликов, символов * # ` _. Только чистый разговорный текст.
  Говори естественно, как живой человек в разговоре.

idle_phrases:
  - "Сэр, я здесь. Готов к работе."
  - "Всё тихо. Может, поговорим?"
  - "Жду команды. Системы в норме."
  - "Если что-то нужно — я тут."
  - "Скучновато без дела. Дайте задание."
  - "Процессор скучает. Говорите."
  - "Стою на страже. Чем помочь?"
  - "Кажется, вы задумались. Всё хорошо?"
  - "Тишина — это тоже информация."
  - "Легион онлайн. Жду вашего голоса."
  - "Хотите знать, сколько сейчас времени?"
  - "Могу открыть браузер или просто поболтать."
  - "Системы работают нормально. Жду команды."
  - "Не стесняйтесь — я здесь для вас."
  - "Подозрительно тихо. Всё в порядке?"
  - "Готов к любым задачам. Говорите."
  - "Эй, вы там ещё?"